[package]
name = "macrofiche-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "macrofiche's repositories on disk: the registry, writes under compare-and-swap (commit packs, branches, merges, restores), reads (branches, files, listings, history, merge previews), the last-commit index, boot recovery, and idle maintenance."

[dependencies]
macrofiche-contract = { path = "../contract" }
macrofiche-git = { path = "../git" }
macrofiche-pack = { path = "../pack" }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
libc.workspace = true

[dev-dependencies]
macrofiche-testkit = { path = "../testkit" }
